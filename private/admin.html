<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPTSMS Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="wrap"><div class="top"><div><div class="brand" data-i18n="adminTitle">GPTSMS 管理后台</div><div class="sub" data-i18n="adminSub">配置上游、生成 CDK、查看号码和会话。</div></div><div class="row"><button class="secondary" id="langBtn">English</button><a class="link" href="/" data-i18n="front">前台</a></div></div><div class="card"><div class="grid"><div><label data-i18n="token">管理员 Token</label><input id="token" type="password"></div><div style="align-self:end"><button id="loadBtn" data-i18n="load">加载后台</button></div></div></div><div id="main" class="hidden"><div class="tabs"><button class="tab active" data-tab="config" data-i18n="config">配置</button><button class="tab" data-tab="cdks">CDK</button><button class="tab" data-tab="accounts" data-i18n="accounts">号码</button><button class="tab" data-tab="sessions" data-i18n="sessions">会话</button><button class="tab" data-tab="clients">API客户</button><button class="tab" data-tab="audit" data-i18n="audit">审计日志</button></div><section class="card panel" id="panel-config"><h2 data-i18n="config">配置</h2><p class="muted">Balance: <span id="balance">-</span></p><div class="grid"><div><label>SMSPool API Key</label><input id="apiKey" placeholder="留空不修改 / keep blank to preserve"></div><div><label>Country</label><input id="country"></div><div><label>Service</label><input id="service"></div><div><label>Pool</label><input id="pool"></div><div><label>Max Price</label><input id="maxPrice"></div><div><label>Pricing Option</label><input id="pricingOption"></div><div><label>Max Account Uses</label><input id="maxAccountUses" type="number"></div><div><label>Timeout Seconds</label><input id="timeoutSeconds" type="number"></div><div><label>Change Number After Seconds</label><input id="changeNumberAfterSeconds" type="number"></div><div><label>Poll Interval Seconds</label><input id="pollIntervalSeconds" type="number"></div><div><label>Resend Cooldown Seconds</label><input id="resendCooldownSeconds" type="number"></div><div><label>Refund Retry Seconds</label><input id="refundRetrySeconds" type="number"></div><div><label>Mock Mode</label><select id="mockMode"><option value="false">false</option><option value="true">true</option></select></div><div><label>Mock Receive After Checks</label><input id="mockReceiveAfterChecks" type="number"></div><div><label>Purchase Enabled</label><select id="purchaseEnabled"><option value="true">true</option><option value="false">false</option></select></div><div><label>Purchase URL</label><input id="purchaseUrl" placeholder="https://..."></div><div><label>购买按钮中文</label><input id="purchaseTextZh"></div><div><label>Buy Button English</label><input id="purchaseTextEn"></div></div><button id="saveConfig" style="margin-top:16px" data-i18n="save">保存</button></section><section class="card panel hidden" id="panel-cdks"><div class="toolbar"><h2>CDK</h2><div class="row"><input id="cdkCount" type="number" value="1" style="width:100px"><input id="cdkNote" placeholder="note" style="width:180px"><button id="createCdk" data-i18n="create">生成</button></div></div><div class="grid" style="margin-bottom:16px"><div><label>核销 CDK（可多个，换行/空格/逗号分隔）</label><textarea id="redeemCdks" rows="3" placeholder="CDK-..."></textarea></div><div style="align-self:end"><button id="redeemCdkBtn" class="danger">核销</button></div></div><div class="msg" id="newCdks"></div><table><thead><tr><th>Code</th><th>Status</th><th>Created</th><th>Used</th><th>Note</th><th>Action</th></tr></thead><tbody id="cdkRows"></tbody></table></section><section class="card panel hidden" id="panel-accounts"><h2 data-i18n="accounts">号码</h2><table><thead><tr><th>Phone</th><th>Use</th><th>Status</th><th>Order</th><th>Updated</th></tr></thead><tbody id="accountRows"></tbody></table></section><section class="card panel hidden" id="panel-sessions"><h2 data-i18n="sessions">会话</h2><table><thead><tr><th>ID</th><th>Phone</th><th>Status</th><th>Message</th><th>Deadline</th></tr></thead><tbody id="sessionRows"></tbody></table></section><section class="card panel hidden" id="panel-clients"><div class="toolbar"><h2>API客户</h2><div class="row"><input id="clientName" placeholder="客户名称" style="width:160px"><input id="clientBalance" type="number" value="0" style="width:100px"><input id="clientPrice" type="number" value="1" style="width:100px"><button id="createClient">创建客户</button></div></div><div class="msg" id="newClientKey"></div><table><thead><tr><th>Name</th><th>Key Prefix</th><th>Balance</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody id="clientRows"></tbody></table><h3>账单流水</h3><table><thead><tr><th>Time</th><th>Client</th><th>Type</th><th>Amount</th><th>Balance</th><th>Session</th></tr></thead><tbody id="billingRows"></tbody></table></section><section class="card panel hidden" id="panel-audit"><h2 data-i18n="audit">审计日志</h2><table><thead><tr><th>Time</th><th>Event</th><th>IP</th><th>User-Agent</th><th>Data</th></tr></thead><tbody id="auditRows"></tbody></table></section></div><div class="toast hidden" id="toast"></div></div><script src="__ADMIN_PATH__/admin.js"></script></body></html>
