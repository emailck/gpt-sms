<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPTSMS</title><link rel="stylesheet" href="/styles.css"></head><body><div class="wrap"><div class="top"><div><div class="sub" data-i18n="subtitle">输入 CDK 获取号码</div></div><div class="row"><button class="secondary" id="langBtn">English</button></div></div><div class="card" id="startCard"><label data-i18n="cdkLabel">CDK</label><div class="row cdk-actions"><input id="cdk" placeholder="CDK-XXXX-XXXX-XXXX"><button id="startBtn" data-i18n="getNumber">获取号码</button><button id="recordsBtn" class="secondary" data-i18n="queryRecords">查询记录</button><button id="purchaseBtn" class="secondary hidden">购买</button></div><div class="msg hidden" id="recordsBox"></div></div><div class="card hidden" id="workCard"><div class="toolbar"><div><div class="muted" data-i18n="currentNumber">当前号码</div><div class="big" id="phone">-</div></div><div class="row"><span class="pill"><span data-i18n="countdown">倒计时</span>: <b id="timer">--</b></span><span class="pill" id="statusPill">waiting</span></div></div><h3 data-i18n="message">短信内容</h3><div class="msg" id="messageBox" data-i18n="waiting">等待短信中...</div><div class="row" style="margin-top:16px"><button id="checkBtn" class="secondary" data-i18n="checkNow">立即检查</button><button id="changeBtn" class="danger" disabled data-i18n="changeNumber">更换号码</button><button id="backBtn" class="secondary" data-i18n="backHome">返回</button></div></div><div class="toast hidden" id="toast"></div></div><script src="/app.js"></script></body></html>
